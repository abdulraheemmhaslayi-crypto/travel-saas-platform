global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'travel-api'
    static_configs:
      - targets: ['api:3000']
    metrics_path: /metrics

  - job_name: 'travel-websocket'
    static_configs:
      - targets: ['websocket:3002']
    metrics_path: /metrics`